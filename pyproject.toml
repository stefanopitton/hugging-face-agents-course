[project]
name = "hugging-face-agents-course"
version = "0.1.0"
description = "Notebooks for the Hugging Face Agents Course"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["dotenv>=0.9.9", "huggingface-hub>=2.2.0", "jupyterlab>=4.6.4"]

[tool.uv.workspace]
members = ["first-agent"] # , "second-agent"

# [tool.basedpyright]
# venvPath = "."
# venv = ".venv"
# typeCheckingMode = "standard"
# executionEnvironments = [
#   { root = "first-agent", extraPaths = [
#     "first-agent",
#   ] },
#   { root = "." },
# ]

[tool.ruff]
exclude = ["notebooks/**.ipynb", "tests/**"]

[tool.ruff.lint]
select = ["D", "I"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[dependency-groups]
dev = ["mdformat>=1.0.0"]
