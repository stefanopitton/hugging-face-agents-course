[project]
name = "hugging-face-agents-course"
version = "0.1.0"
description = "Notebooks for the Hugging Face Agents Course"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix>=20.3.0",
    "datasets>=5.1.0",
    "dotenv>=0.9.9",
    "geopandas>=1.2.0",
    "google-search-results>=2.4.2",
    "huggingface-hub>=2.2.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "kaleido>=1.5.0",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "llama-index>=0.14.25",
    "llama-index-callbacks-arize-phoenix>=0.8.0",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-llms-huggingface-api>=0.8.0",
    "llama-index-tools-google>=0.8.0",
    "llama-index-tools-mcp>=0.4.8",
    "llama-index-vector-stores-chroma>=0.6.0",
    "mypy-extensions>=1.1.0",
    "openinference-instrumentation-smolagents>=0.1.43",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "plotly>=7.1.0",
    "rank-bm25>=0.2.2",
    "shapely>=2.2.0",
    "smolagents[litellm,telemetry]>=1.26.0",
]

[tool.uv.workspace]
members = ["first-agent"] # , "second-agent"

# [tool.basedpyright]
# venvPath = "."
# venv = ".venv"
# typeCheckingMode = "standard"
# executionEnvironments = [
#   { root = "first-agent", extraPaths = [
#     "first-agent",
#   ] },
#   { root = "." },
# ]

[tool.ruff]
exclude = ["notebooks/**.ipynb", "tests/**"]

[tool.ruff.lint]
select = ["D", "I"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[dependency-groups]
dev = ["mdformat>=1.0.0"]
